{% extends "base.html" %}

{% block title %}Commit审查记录 - AI 代码质量管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Commit 审查记录</h1>
    <div class="btn-group" role="group">
        <a href="/admin/commits" class="btn btn-outline-secondary {% if not status %}active{% endif %}">全部</a>
        <a href="/admin/commits?status=pending" class="btn btn-outline-warning {% if status == 'pending' %}active{% endif %}">待检查</a>
        <a href="/admin/commits?status=success" class="btn btn-outline-success {% if status == 'success' %}active{% endif %}">通过</a>
        <a href="/admin/commits?status=failure" class="btn btn-outline-danger {% if status == 'failure' %}active{% endif %}">有问题</a>
        <a href="/admin/commits?status=skipped" class="btn btn-outline-info {% if status == 'skipped' %}active{% endif %}">跳过</a>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>项目</th>
                <th>Commit ID</th>
                <th>分支</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="commit-table-body">
            <tr><td colspan="7" class="text-center">加载中...</td></tr>
        </tbody>
    </table>
</div>

<nav id="pagination" class="mt-4"></nav>
{% endblock %}

{% block scripts %}
<script>
const page = {{ page|default(1) }};
const status = "{{ status|default('') }}";

function loadData(currentPage = 1) {
    let url = `/api/admin/commits?page=${currentPage}`;
    if (status) url += `&status=${status}`;

    fetch(url)
        .then(r => r.json())
        .then(data => {
            renderTable(data.items);
            renderPagination(data);
        });
}

function renderTable(items) {
    const tbody = document.getElementById('commit-table-body');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = items.map(item => `
        <tr>
            <td>${item.id}</td>
            <td>${escapeHtml(item.project_name || '-')}</td>
            <td><code>${item.commit_id.substring(0, 12)}</code></td>
            <td>${escapeHtml(item.branch || '-')}</td>
            <td>${getStatusBadge(item.check_result)}</td>
            <td>${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</td>
            <td><a href="/admin/commits/${item.id}" class="btn btn-sm btn-outline-primary">详情</a></td>
        </tr>
    `).join('');
}

function getStatusBadge(result) {
    if (result === 'no_issue') return '<span class="badge bg-success status-badge">通过</span>';
    if (result === 'has_issue') return '<span class="badge bg-danger status-badge">有问题</span>';
    if (result === 'skipped') return '<span class="badge bg-info status-badge">跳过</span>';
    return '<span class="badge bg-warning text-dark status-badge">待检查</span>';
}

function renderPagination(data) {
    const nav = document.getElementById('pagination');
    if (data.pages <= 1) {
        nav.innerHTML = '';
        return;
    }

    let html = '<ul class="pagination justify-content-center">';
    const baseUrl = status ? `/admin/commits?status=${status}&page=` : `/admin/commits?page=`;

    if (data.page > 1) html += `<li class="page-item"><a class="page-link" href="${baseUrl}${data.page - 1}">上一页</a></li>`;

    for (let i = 1; i <= data.pages; i++) {
        const active = i === data.page ? 'active' : '';
        html += `<li class="page-item ${active}"><a class="page-link" href="${baseUrl}${i}">${i}</a></li>`;
    }

    if (data.page < data.pages) html += `<li class="page-item"><a class="page-link" href="${baseUrl}${data.page + 1}">下一页</a></li>`;

    html += '</ul>';
    nav.innerHTML = html;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

loadData(page);
</script>
{% endblock %}
