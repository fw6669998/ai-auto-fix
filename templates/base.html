<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 代码质量管理{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 60px; }
        .status-badge { font-size: 0.85em; }
        pre code { font-size: 0.85em; }
        pre { background-color: #1e1e1e; border: 1px solid #3a3a3a; }
        .accordion-button:not(.collapsed) { background-color: #2d2d2d; color: #fff; }
        .accordion-button { background-color: #212529; color: #fff; }
        .accordion-item { border-color: #3a3a3a; }
        .accordion-body { background-color: #1e1e1e; }
        .card { border-color: #3a3a3a; }
        .card-header { background-color: #2d2d2d; border-color: #3a3a3a; }
        .table { --bs-table-bg: transparent; }
        .bg-code { background-color: #1e1e1e !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/admin/">AI 代码质量</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/admin/' %}active{% endif %}" href="/admin/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/admin/projects') %}active{% endif %}" href="/admin/projects">工程管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/admin/errors') %}active{% endif %}" href="/admin/errors">错误修复</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/admin/commits') %}active{% endif %}" href="/admin/commits">Commit审查</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
